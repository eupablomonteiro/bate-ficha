services:
  mongo:
    image: mongo:7
    container_name: bate-ficha-mongo
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DB: ${MONGO_DB}
volumes:
  mongo_data:
    name: bate-ficha-mongo-data
